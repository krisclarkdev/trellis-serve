id: gemma-4-26b-exl3-3.10bpw
served_model_name: coder-primary

source:
  repo: turboderp/gemma-4-26B-A4B-it-exl3
  revision: 3.10bpw
  quant: exl3 3.10 bpw
  notes: Gemma-4 26B A4B MoE EXL3.

vllm:
  dtype: bfloat16
  max_model_len: 131072
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.85
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  trust_remote_code: true
  enable_prefix_caching: true
  enable_auto_tool_choice: true
  tool_call_parser: gemma4
  speculative_config:
    method: ngram
    num_speculative_tokens: 4
    prompt_lookup_max: 8
  limit_mm_per_prompt: {image: 0, video: 0}
  compilation_config:
    cudagraph_mode: FULL_DECODE_ONLY
    cudagraph_capture_sizes: [1, 2, 4, 8, 12, 16, 24, 32, 40, 48, 56, 64]

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  ZE_FLAT_DEVICE_HIERARCHY: COMPOSITE
  EXL3_KV_BLOCK_EXACT: "1"
  EXL3_ONEDNN_ATTN: "1"
  VLLM_XPU_ENABLE_XPU_GRAPH: "1"

parallel:
  mode: data
  gpus: [0]
  base_port: 8000
